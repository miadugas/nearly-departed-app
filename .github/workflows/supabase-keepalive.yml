# Pings the Supabase project twice daily so the free-tier database is unlikely
# to hit the ~7-day inactivity pause (a paused backend breaks sign-in/sync —
# and would fail App Review). The REST queries touch the database, which is
# what counts as activity ("a few requests per day" per Supabase's docs); the
# anon key is the same publishable key shipped in app.json.
#
# Caveats: GitHub may disable scheduled workflows in public repos after ~60 days
# without repo activity. GitHub emails a warning first; recovery after
# disablement is explicit via the Actions UI, `gh workflow enable
# supabase-keepalive.yml`, or editing the cron expression — an ordinary
# unrelated push does not re-enable it. Pinging is best-effort; Supabase Pro is
# the only contractual fix.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 3,15 * * *" # twice daily, 03:23 and 15:23 UTC
  workflow_dispatch: {} # allow manual runs to test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the database twice via PostgREST
        run: |
          ANON_KEY="sb_publishable_eWRSXhYETPUedQCOaSVO9A_Y5QuvvIH"
          for QUERY in \
            "profiles?select=id&limit=1" \
            "favorites?select=user_id&limit=1"
          do
            STATUS=$(curl --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" \
              "https://lazmmkvavwicxophadmt.supabase.co/rest/v1/${QUERY}" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}")
            echo "${QUERY}: HTTP ${STATUS}"
            # 200 = alive; anything else (including 5xx while paused) fails the
            # job so GitHub emails you instead of the pause going unnoticed.
            [ "${STATUS}" = "200" ] || exit 1
          done
